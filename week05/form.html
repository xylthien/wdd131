<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Review Form</title>
    <meta name="description" content="Simple webpage exploring forms, submitting results, and counting how many times a page loads">
    <meta name="author" content="Devin Hale">
    <script src="scripts/form.js" defer></script>
    <link rel="stylesheet" href="styles/form.css">
</head>
<body>
    <header>
        <h1>Product Review</h1>
    </header>
    <main>
        <form action="review.html" method="get" class="pr1">
            <div>
                <label for="productName">Product Name</label>
                <select name="productName" id="productName" required>
                    <option value="" disabled selected>Select a Product ...</option>
                </select>
            </div>

            <div id="overall-rating">
                <span>Overall Rating</span>
                <label><input type="radio" name="rating" value="1Star" id="rating-1">&star;</label>
                <label><input type="radio" name="rating" value="2Star" id="rating-2">&star;&star;</label>
                <label><input type="radio" name="rating" value="3Star" id="rating-3">&star;&star;&star;</label>
                <label><input type="radio" name="rating" value="4Star" id="rating-4">&star;&star;&star;&star;</label>
                <label><input type="radio" name="rating" value="5Star" id="rating-5">&star;&star;&star;&star;&star;</label>
            </div>

            <div>
                <label for="complete-date">Date of Installation</label>
                <input type="date" name="complete-date" id="complete-date" required>
            </div>

            <div>Which features did you find useful in the product?<br><span class="italics">(Check all that apply)</span>
                <label><input type="checkbox" id="design" name="design" value="yes"> Design</label>
                <label><input type="checkbox" id="durability" name="durability" value="yes"> Durability</label>
                <label><input type="checkbox" id="ease-of-use" name="ease-of-use" value="yes"> Ease of Use</label>
                <label><input type="checkbox" id="performance" name="performance" value="yes"> Performance</label>
            </div>
            
            <div>
                <label for="review">Written Review <span class="optional">(Optional)</span></label>
                <textarea name="review" id="review"></textarea>
            </div>

            <div>
                <label for="userName">Your Name <span class="optional">(Optional)</span></label>
                <textarea name="userName" id="userName"></textarea>
            </div>

            <input type="submit" value="Post Review">
        </form>
    </main>
    <footer>
        <p>&copy; <span id="currentyear"></span> | Devin Hale | Utah, USA</p>
        <p id="lastModified"></p>
    </footer>
</body>
</html>
