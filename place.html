<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Week 3 Project | Country Page</title>
    <meta name="author" content="Devin Hale">
    <meta name="description" content="Webpage talking about my favorite USA state, Utah! Some info about Utah, including population, area, and the 'current' weather.">
    <link rel="stylesheet" href="styles/place.css">
    <script src="scripts/place.js" defer></script>
</head>
<body>
    <header>
        <h1>Utah, USA</h1>
    </header>
    <main>
        <div class="hero-image">
            <picture>
                <source media="(min-width:600px)" srcset="images/welcome-utah.webp">
                <img src="images/utah-arch.webp" alt="welcome to utah sign">
            </picture>
        </div>
        <div id="data">
            <h2>Data</h2>
            <table>
                <tr>
                    <td class="table-head">Area: </td>
                    <td>84,899 sq mi</td>
                </tr>
                <tr>
                    <td class="table-head">Population: </td>
                    <td>3,538,904</td>
                </tr>
                <tr>
                    <td class="table-head">Capital: </td>
                    <td>Salt Lake City</td>
                </tr>
                <tr>
                    <td class="table-head">Languages: </td>
                    <td>English</td>
                </tr>
                <tr>
                    <td class="table-head">Currency: </td>
                    <td>USD ($)</td>
                </tr>
                <tr>
                    <td class="table-head">Time Zone: </td>
                    <td>UTC -6</td>
                </tr>
                <tr>
                    <td class="table-head">Calling Code: </td>
                    <td>+435 or +801</td>
                </tr>
                <tr>
                    <td class="table-head">Internet TLD: </td>
                    <td>.gov</td>
                </tr>
            </table>
        </div>
        <div id="weather">
            <h2>Weather </h2>
            <table>
                <tr>
                    <td class="table-head">Temperature: </td>
                    <td><span id="temperature"></span>&deg;F</td>
                </tr>
                <tr>
                    <td class="table-head">Conditions: </td>
                    <td>Partly Cloudy</td>
                </tr>
                <tr>
                    <td class="table-head">Wind: </td>
                    <td><span id="windSpeed"></span>mi/h</td>
                </tr>
                <tr>
                    <td class="table-head">Wind Chill: </td>
                    <td><span id="windChill"></span></td>
                </tr>
            </table>
        </div>
    </main>
    <footer>
        <p>&copy; <span id="currentyear"></span> | Devin Hale | Utah, USA</p>
        <p id="lastModified"></p>
    </footer>
</body>
</html>
